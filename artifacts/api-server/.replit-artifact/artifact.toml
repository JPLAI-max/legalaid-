kind = "api"
    previewPath = "/api"
    title = "API Server"
    version = "1.0.0"
    id = "3B4_FFSkEVBkAeYMFRJ2e"

    [[services]]
    localPort = 8080
    name = "API Server"
    paths = ["/api", "/"]

    [services.development]
    run = "pnpm --filter @workspace/api-server run dev"

    [services.production]

    # build:production compiles the React frontend (vite build) then the API server
    # (esbuild) in one step so a single Node process can serve both.
    [services.production.build]
    args = ["pnpm", "run", "build:production"]

    [services.production.build.env]
    NODE_ENV = "production"
    BASE_PATH = "/"

    [services.production.run]
    # Single Node process — serves /api/* and the React SPA at all other paths.
    args = ["node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

    [services.production.run.env]
    PORT = "8080"
    NODE_ENV = "production"

    [services.production.health.startup]
    path = "/api/healthz"
    