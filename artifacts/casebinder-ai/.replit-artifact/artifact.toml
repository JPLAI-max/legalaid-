kind = "web"
previewPath = "/"
title = "CaseBinder AI"
version = "1.0.0"
id = "artifacts/casebinder-ai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25926

[services.development]
run = "pnpm --filter @workspace/casebinder-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/casebinder-ai", "run", "build" ]
publicDir = "artifacts/casebinder-ai/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25926"
BASE_PATH = "/"
